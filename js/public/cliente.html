<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pedro Neto — Personal Trainer | Consultoria</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700;800&family=Open+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
    <style>
      .btn-enviar {
        margin-top: 1.5rem;
        padding: 0.9rem 2rem;
        border: 0;
        border-radius: 8px;
        background: #2563eb;
        color: #fff;
        font:
          600 1rem "Montserrat",
          sans-serif;
        cursor: pointer;
      }
      .btn-enviar:disabled {
        opacity: 0.6;
        cursor: wait;
      }
      #status {
        margin-top: 1rem;
        font-weight: 600;
      }
      #status.ok {
        color: #16a34a;
      }
      #status.erro {
        color: #dc2626;
      }
    </style>
  </head>
  <body class="cliente">
    <header>
      <nav>
        <div class="logo">
          <a href="index.html" class="logo-link">
            <img src="image/logobranca1.png" alt="logo PN" class="logo-img" />
          </a>
          <div>
            <span class="logo-word">PEDRO NETO</span>
            <span class="logo-sub">TREINO · CONSULTORIA</span>
          </div>
        </div>
        <button
          class="nav-toggle"
          id="navToggle"
          aria-label="Abrir menu"
          aria-expanded="false"
        >
          ☰
        </button>
        <div class="nav-links" id="navLinks">
          <a href="index.html">O método</a>
          <a href="index.html">O profissional</a>
          <a href="index.html">Filosofia</a>
          <a href="index.html">Nutrição</a>
          <a href="index.html">Como funciona</a>
          <a href="cliente.html" class="nav-cta">Agendar avaliação</a>
        </div>
      </nav>
    </header>

    <main>
      <section class="form-container">
        <div class="cadastro-title">
          <h1>Preencha seus dados</h1>
          <p>Seus dados serão analisados de forma segura.</p>
        </div>

        <form id="form-agendamento" enctype="multipart/form-data">
          <div class="dados-container">
            <div class="dados">
              <label for="nome" class="nome-cli">Nome completo</label>
              <input
                type="text"
                id="nome"
                name="nome"
                placeholder="Digite seu nome completo"
                required
                minlength="3"
                maxlength="120"
                autocomplete="name"
              />
            </div>

            <div class="dados">
              <label for="nascimento" class="nascimento-cli"
                >Data de nascimento</label
              >
              <input
                type="text"
                id="nascimento"
                name="nascimento"
                placeholder="DD/MM/AAAA"
                maxlength="10"
                inputmode="numeric"
                required
              />
            </div>

            <div class="dados">
              <label for="telefone" class="nascimento-cli"
                >Número de telefone / WhatsApp</label
              >
              <input
                type="tel"
                id="telefone"
                name="telefone"
                placeholder="(11) 91234-5678"
                maxlength="15"
                inputmode="numeric"
                required
                autocomplete="tel"
              />
            </div>

            <div class="dados">
              <label for="atestado"
                >Atestado médico <span>(opcional)</span></label
              >
              <input
                type="file"
                id="atestado"
                name="atestado"
                accept="application/pdf,image/jpeg,image/png,image/webp"
              />
              <small class="field-help">PDF ou imagem, até 10 MB.</small>
            </div>
          </div>

          <button type="submit" id="btn-enviar" class="btn-enviar">
            Agendar consulta
          </button>
          <p id="status" role="status"></p>
        </form>
      </section>
    </main>

    <script>
      document.addEventListener("DOMContentLoaded", () => {
        const telefoneInput = document.getElementById("telefone");
        const navToggle = document.getElementById("navToggle");
        const navLinks = document.getElementById("navLinks");

        navToggle.addEventListener("click", () => {
          const isOpen = navLinks.classList.toggle("open");
          navToggle.setAttribute("aria-expanded", isOpen);
          navToggle.setAttribute(
            "aria-label",
            isOpen ? "Fechar menu" : "Abrir menu",
          );
        });
        navLinks.querySelectorAll("a").forEach((link) =>
          link.addEventListener("click", () => {
            navLinks.classList.remove("open");
            navToggle.setAttribute("aria-expanded", "false");
            navToggle.setAttribute("aria-label", "Abrir menu");
          }),
        );

        // Máscara DD/MM/AAAA
        document.getElementById("nascimento").addEventListener("input", (e) => {
          let v = e.target.value.replace(/\D/g, "").slice(0, 8);
          if (v.length > 4) v = v.replace(/(\d{2})(\d{2})(\d+)/, "$1/$2/$3");
          else if (v.length > 2) v = v.replace(/(\d{2})(\d+)/, "$1/$2");
          e.target.value = v;
        });

        telefoneInput.addEventListener("input", (e) => {
          let v = e.target.value.replace(/\D/g, "").slice(0, 11);
          if (v.length > 10)
            v = v.replace(/(\d{2})(\d{5})(\d{1,4})/, "($1) $2-$3");
          else if (v.length > 6)
            v = v.replace(/(\d{2})(\d{4})(\d{1,4})/, "($1) $2-$3");
          else if (v.length > 2) v = v.replace(/(\d{2})(\d+)/, "($1) $2");
          else if (v.length > 0) v = v.replace(/(\d*)/, "($1");
          e.target.value = v;
        });

        // Envio para o servidor
        const form = document.getElementById("form-agendamento");
        const botao = document.getElementById("btn-enviar");
        const status = document.getElementById("status");

        form.addEventListener("submit", async (e) => {
          e.preventDefault();

          const dados = Object.fromEntries(new FormData(form));
          const nascimentoInformado = String(dados.nascimento || "").trim();
          const partesNascimento = nascimentoInformado.split("/");

          if (
            partesNascimento.length !== 3 ||
            partesNascimento.some((parte) => !/^\d+$/.test(parte))
          ) {
            status.textContent =
              "Informe a data de nascimento no formato DD/MM/AAAA.";
            status.className = "erro";
            return;
          }

          const [d, m, a] = partesNascimento;
          dados.nascimento = `${a}-${m}-${d}`; // DD/MM/AAAA -> AAAA-MM-DD
          dados.telefone = String(dados.telefone || "").replace(/\D/g, "");

          if (dados.telefone.length !== 11) {
            status.textContent =
              "Informe um celular válido com DDD, no formato (XX) XXXXX-XXXX.";
            status.className = "erro";
            return;
          }

          botao.disabled = true;
          status.className = "";
          status.textContent = "Enviando...";

          try {
            const formData = new FormData(form);
            formData.set("nascimento", dados.nascimento);
            formData.set("telefone", dados.telefone);

            const resp = await fetch("/api/agendamentos", {
              method: "POST",
              body: formData,
            });
            const json = await resp.json().catch(() => ({}));
            if (!resp.ok)
              throw new Error(
                json.erro || "Não foi possível agendar. Tente novamente.",
              );

            form.reset();
            status.textContent =
              "Agendamento recebido! Entraremos em contato pelo WhatsApp.";
            status.className = "ok";
          } catch (err) {
            status.textContent =
              err instanceof TypeError
                ? "Sem conexão com o servidor. Verifique sua internet e tente de novo."
                : err.message;
            status.className = "erro";
          } finally {
            botao.disabled = false;
          }
        });
      });
    </script>
  </body>
</html>
